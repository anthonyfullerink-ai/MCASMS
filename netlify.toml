[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "FROM_EMAIL,OWNER_EMAIL,GEMINI_KEY,RESEND_API_KEY,STRIPE_SECRET_KEY,GEMINI_API_KEY,FB_PAGE_ID,IG_USER_ID,OWNER_ADMIN_USER,OWNER_ADMIN_PASS"

# API Route: Version Manifest (serve static version.json)
[[redirects]]
  from = "/api/version.json"
  to = "/version.json"
  status = 200

[[redirects]]
  from = "/api/version"
  to = "/version.json"
  status = 200

# API Route: Blog Posts JSON
[[redirects]]
  from = "/api/blog-posts"
  to = "/blog/posts.json"
  status = 200

# API Route: Live Stripe Status Check
[[redirects]]
  from = "/api/stripe-status"
  to = "/.netlify/functions/stripe-status"
  status = 200

# API Route: Stripe Webhook for Automated Purchases & License Email
[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# API Route: Cancel 3-Day Trial
[[redirects]]
  from = "/api/cancel-trial"
  to = "/.netlify/functions/cancel-trial"
  status = 200

# API Route: Device Reset
[[redirects]]
  from = "/api/reset-device"
  to = "/.netlify/functions/reset-device"
  status = 200

# API Route: Send License Email
[[redirects]]
  from = "/api/send-license-email"
  to = "/.netlify/functions/send-license-email"
  status = 200

# API Route: Generate Blog Article On-Demand
[[redirects]]
  from = "/api/generate-blog"
  to = "/.netlify/functions/generate-blog"
  status = 200

# API Route: Publish Social Blog Post
[[redirects]]
  from = "/api/publish-social"
  to = "/.netlify/functions/publish-social"
  status = 200

# API Route: Update OTA Version
[[redirects]]
  from = "/api/update-version"
  to = "/.netlify/functions/update-version"
  status = 200

# API Route: Central Webhook Relay - Register Device
[[redirects]]
  from = "/api/register-device"
  to = "/.netlify/functions/register-device"
  status = 200

# API Route: Central Webhook Relay - Dispatch SMS
[[redirects]]
  from = "/api/dispatch-sms"
  to = "/.netlify/functions/dispatch-sms"
  status = 200

# API Route: Agency Fleet Management API
[[redirects]]
  from = "/api/agency/*"
  to = "/.netlify/functions/agency-fleet"
  status = 200

[[redirects]]
  from = "/api/agency"
  to = "/.netlify/functions/agency-fleet"
  status = 200

# API Route: Create Voice Pro Checkout
[[redirects]]
  from = "/api/create-voice-pro-checkout"
  to = "/.netlify/functions/create-voice-pro-checkout"
  status = 200

# API Route: Support Ticket Submission
[[redirects]]
  from = "/api/submit-ticket"
  to = "/.netlify/functions/submit-ticket"
  status = 200

# API Route: Support Gateway API
[[redirects]]
  from = "/api/support/*"
  to = "/.netlify/functions/support-gateway"
  status = 200

[[redirects]]
  from = "/api/support"
  to = "/.netlify/functions/support-gateway"
  status = 200

# Direct access to Agency Fleet Dashboard
[[redirects]]
  from = "/agency/dashboard"
  to = "/agency_dashboard.html"
  status = 200

# Direct access to Agency Landing Page
[[redirects]]
  from = "/agency"
  to = "/agency.html"
  status = 200

# Direct access to owner dashboard
[[redirects]]
  from = "/owner"
  to = "/owner_admin_dashboard.html"
  status = 200

# Direct access to success confirmation page
[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

# Serve sales_landing_page.html as homepage
[[redirects]]
  from = "/"
  to = "/sales_landing_page.html"
  status = 200

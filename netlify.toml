[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["data/**", "blog/posts.json"]

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "FROM_EMAIL,OWNER_EMAIL,GEMINI_KEY,RESEND_API_KEY,STRIPE_SECRET_KEY,GEMINI_API_KEY,FB_PAGE_ID,IG_USER_ID,OWNER_ADMIN_USER,OWNER_ADMIN_PASS"

# API Route: Version Manifest (serve static version.json)
[[redirects]]
  from = "/api/version.json"
  to = "/version.json"
  status = 200

[[redirects]]
  from = "/api/version"
  to = "/version.json"
  status = 200


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGreenCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Background -->
  <rect width="512" height="512" rx="115" fill="#090B0E" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#neonGreenCyan)" stroke-width="6" opacity="0.35" />

  <g filter="url(#glow)">
    <!-- Missed Call Return Loop Arrow -->
    <path d="M 135 270 C 130 185 185 125 270 120 C 300 118 335 128 360 145" 
          fill="none" 
          stroke="#00E676" 
          stroke-width="26" 
          stroke-linecap="round" />
    <!-- Arrowhead -->
    <polygon points="340,115 385,150 335,175" fill="#00E676" />

    <!-- Stylized Modern Phone Handset -->
    <path d="M 185 240 C 175 250 170 270 180 300 C 200 350 250 400 300 420 C 330 430 350 425 360 415 L 395 380 C 405 370 405 350 390 340 L 345 310 C 330 300 315 305 305 315 C 295 325 280 325 265 315 C 245 300 230 280 225 265 C 220 250 225 235 235 225 L 245 215 C 255 205 255 190 245 175 L 215 130 C 205 115 185 115 175 125 Z" 
          fill="none" 
          stroke="url(#neonGreenCyan)" 
          stroke-width="24" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- SMS Auto-Reply Speech Bubble -->
    <path d="M 285 185 H 415 A 22 22 0 0 1 437 207 V 285 A 22 22 0 0 1 415 307 H 355 L 320 338 V 307 H 285 A 22 22 0 0 1 263 285 V 207 A 22 22 0 0 1 285 185 Z" 
          fill="#0D1117" 
          stroke="#00F0FF" 
          stroke-width="20" 
          stroke-linejoin="round" />

    <!-- SMS Fast Chat Lines -->
    <line x1="305" y1="232" x2="385" y2="232" stroke="#00E676" stroke-width="12" stroke-linecap="round" />
    <line x1="305" y1="262" x2="360" y2="262" stroke="#00E676" stroke-width="12" stroke-linecap="round" />

    <!-- Instant Lightning Bolt Spark -->
    <polygon points="415,225 390,265 410,265 395,305 435,255 410,255" fill="#00E676" stroke="#090B0E" stroke-width="3" />
  </g>
</svg>
